name: Build and Push Compose Configuration

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
    paths:
      - "docker/docker-compose.yml"
      - "docker/Dockerfile.compose"
      - ".github/workflows/build-compose.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          DOCKER_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/stilnovo-compose
          VERSION=latest
          TAGS="${DOCKER_IMAGE}:${VERSION}"

          if [[ $GITHUB_REF == refs/heads/main ]]; then
            TAGS="${TAGS},${DOCKER_IMAGE}:main"
          elif [[ $GITHUB_REF == refs/heads/develop ]]; then
            TAGS="${TAGS},${DOCKER_IMAGE}:develop"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            TAGS="${TAGS},${DOCKER_IMAGE}:${VERSION}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push Compose OCI artifact
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile.compose
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Docker Compose configuration for Stilnovo
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log build status
        if: success()
        run: |
          echo "Compose configuration built and pushed successfully"
          echo "Repository: ${{ secrets.DOCKER_HUB_USERNAME }}/stilnovo-compose"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

      - name: Log failure
        if: failure()
        run: |
          echo "Build failed for Compose configuration"
          echo "Check the logs above for details"
